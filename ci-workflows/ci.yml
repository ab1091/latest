name: CI

# Runs automatically on every push and pull request. Nothing here touches a
# real external API (Vapi/Twilio/Gemini/etc.) — those live in smoke-test.yml,
# which only runs when someone deliberately clicks "Run workflow". This file
# is safe to run unattended on every single commit.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["development", "main"]

jobs:
  # ── Step 1: does the code even parse? ───────────────────────────────────
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check every .py file parses (catches typos/syntax errors fast)
        run: |
          find ai-service crm-service -name "*.py" -not -path "*/venv/*" \
            -exec python3 -m py_compile {} +

  # ── Step 2: do migrations apply cleanly to a brand-new database? ────────
  # Uses a throwaway Postgres container — no real credentials touched.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: aicrm_app
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: aicrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Enable pgvector extension
        run: |
          PGPASSWORD=ci_test_password psql -h localhost -U aicrm_app -d aicrm \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Apply base schema
        run: |
          PGPASSWORD=ci_test_password psql -h localhost -U aicrm_app -d aicrm \
            -f database/schema.pg.sql
      - name: Apply every migration in order
        run: |
          for f in database/migrations/*.sql; do
            echo "Applying $f"
            PGPASSWORD=ci_test_password psql -h localhost -U aicrm_app -d aicrm -f "$f"
          done

  # ── Step 3: do the Docker images actually build? ─────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ai-service, crm-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image (not pushed — build-only validation)
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: allzone-ai/${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
